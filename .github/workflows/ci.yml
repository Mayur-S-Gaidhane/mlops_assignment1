name: CI

on:
  push:
    # Branch names must NOT contain spaces. Use literal names: reg and hyper.
    branches: [ reg, hyper ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline (mode inferred from branch)
        env:
          # These are read by regression.py to infer mode automatically
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          python regression.py

      - name: Upload metrics.csv
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: metrics.csv
